<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classrooms - College Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>🏫 College Scheduler</h2>
            <span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <div class="nav-label">Manage</div>
            <a href="teachers.html"><span class="icon">👨‍🏫</span> Teachers</a>
            <a href="subjects.html"><span class="icon">📚</span> Subjects</a>
            <a href="classrooms.html" class="active"><span class="icon">🚪</span> Classrooms</a>
            <div class="nav-label">Scheduling</div>
            <a href="timetable.html"><span class="icon">📅</span> Timetable</a>
            <a href="staff-schedule.html"><span class="icon">🕐</span> Staff Schedule</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>🚪 Classrooms</h1>
            <div class="topbar-right">👤 Admin</div>
        </div>

        <div class="content">
            <div id="alert-box" class="alert hidden"></div>

            <div class="card">
                <div class="toolbar">
                    <div class="card-title" style="margin:0">All Classrooms</div>
                    <button class="btn btn-primary" onclick="openModal('add-modal')">+ Add Classroom</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Room Number</th>
                                <th>Capacity</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="classroom-table">
                            <tr><td colspan="5"><div class="empty"><div class="empty-icon">🚪</div><p>No classrooms added yet.</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>Add Classroom</h3>
            <button class="modal-close" onclick="closeModal('add-modal')">×</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>Room Number *</label>
                    <input type="text" id="r-number" placeholder="e.g. A101" />
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" id="r-capacity" placeholder="60" min="1" />
                </div>
            </div>
            <div class="form-group">
                <label>Room Type</label>
                <select id="r-type">
                    <option value="Lecture Hall">Lecture Hall</option>
                    <option value="Lab">Lab</option>
                    <option value="Seminar Hall">Seminar Hall</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('add-modal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveClassroom()">Save</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    requireLogin();
    let classrooms = [];

    async function loadClassrooms() {
        classrooms = await apiFetch('/classrooms');
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('classroom-table');
        if (classrooms.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">🚪</div><p>No classrooms added yet.</p></div></td></tr>`;
            return;
        }
        const typeColors = { 'Lecture Hall': 'badge-blue', 'Lab': 'badge-green', 'Seminar Hall': 'badge-yellow' };
        tbody.innerHTML = classrooms.map((c, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${c.room_number}</strong></td>
                <td>${c.capacity || 60}</td>
                <td><span class="badge ${typeColors[c.room_type] || 'badge-blue'}">${c.room_type || 'Lecture Hall'}</span></td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteClassroom(${c.id})">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveClassroom() {
        const room_number = document.getElementById('r-number').value.trim();
        if (!room_number) { showAlert('Room number is required.', 'danger'); return; }

        const data = {
            room_number,
            capacity: parseInt(document.getElementById('r-capacity').value) || 60,
            room_type: document.getElementById('r-type').value
        };

        await apiFetch('/classrooms', 'POST', data);
        showAlert('Classroom added!');
        closeModal('add-modal');
        document.getElementById('r-number').value = '';
        document.getElementById('r-capacity').value = '';
        loadClassrooms();
    }

    async function deleteClassroom(id) {
        if (!confirm('Delete this classroom?')) return;
        await apiFetch(`/classrooms/${id}`, 'DELETE');
        showAlert('Classroom deleted.', 'danger');
        loadClassrooms();
    }

    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    loadClassrooms();
</script>
</body>
</html>
