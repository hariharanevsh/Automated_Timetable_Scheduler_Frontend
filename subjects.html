<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - College Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>🏫 College Scheduler</h2>
            <span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <div class="nav-label">Manage</div>
            <a href="teachers.html"><span class="icon">👨‍🏫</span> Teachers</a>
            <a href="subjects.html" class="active"><span class="icon">📚</span> Subjects</a>
            <a href="classrooms.html"><span class="icon">🚪</span> Classrooms</a>
            <div class="nav-label">Scheduling</div>
            <a href="timetable.html"><span class="icon">📅</span> Timetable</a>
            <a href="staff-schedule.html"><span class="icon">🕐</span> Staff Schedule</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>📚 Subjects</h1>
            <div class="topbar-right">👤 Admin</div>
        </div>

        <div class="content">
            <div id="alert-box" class="alert hidden"></div>

            <div class="card">
                <div class="toolbar">
                    <div class="card-title" style="margin:0">All Subjects</div>
                    <button class="btn btn-primary" onclick="openModal('add-modal')">+ Add Subject</button>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Subject Name</th>
                                <th>Code</th>
                                <th>Department</th>
                                <th>Hours/Week</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subject-table">
                            <tr><td colspan="6"><div class="empty"><div class="empty-icon">📚</div><p>No subjects added yet.</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="add-modal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Add Subject</h3>
            <button class="modal-close" onclick="closeModal('add-modal')">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="subject-id" />
            <div class="form-row">
                <div class="form-group">
                    <label>Subject Name *</label>
                    <input type="text" id="s-name" placeholder="e.g. Data Structures" />
                </div>
                <div class="form-group">
                    <label>Subject Code</label>
                    <input type="text" id="s-code" placeholder="e.g. CS301" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="s-dept" placeholder="e.g. Computer Science" />
                </div>
                <div class="form-group">
                    <label>Hours per Week</label>
                    <input type="number" id="s-hours" placeholder="5" min="1" max="42" />
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('add-modal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveSubject()">Save</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    requireLogin();
    let subjects = [];

    async function loadSubjects() {
        subjects = await apiFetch('/subjects');
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('subject-table');
        if (subjects.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📚</div><p>No subjects added yet.</p></div></td></tr>`;
            return;
        }
        tbody.innerHTML = subjects.map((s, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${s.name}</strong></td>
                <td><span class="badge badge-blue">${s.code || '-'}</span></td>
                <td>${s.department || '-'}</td>
                <td>${s.hours_per_week || 5}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" onclick="editSubject(${s.id})">✏️ Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSubject(${s.id})">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
    }

    function editSubject(id) {
        const s = subjects.find(x => x.id === id);
        if (!s) return;
        document.getElementById('modal-title').textContent = 'Edit Subject';
        document.getElementById('subject-id').value = s.id;
        document.getElementById('s-name').value = s.name;
        document.getElementById('s-code').value = s.code || '';
        document.getElementById('s-dept').value = s.department || '';
        document.getElementById('s-hours').value = s.hours_per_week || 5;
        openModal('add-modal');
    }

    async function saveSubject() {
        const id = document.getElementById('subject-id').value;
        const name = document.getElementById('s-name').value.trim();
        if (!name) { showAlert('Subject name is required.', 'danger'); return; }

        const data = {
            name,
            code: document.getElementById('s-code').value.trim(),
            department: document.getElementById('s-dept').value.trim(),
            hours_per_week: parseInt(document.getElementById('s-hours').value) || 5
        };

        if (id) {
            await apiFetch(`/subjects/${id}`, 'PUT', data);
            showAlert('Subject updated!');
        } else {
            await apiFetch('/subjects', 'POST', data);
            showAlert('Subject added!');
        }

        closeModal('add-modal');
        document.getElementById('subject-id').value = '';
        document.getElementById('modal-title').textContent = 'Add Subject';
        loadSubjects();
    }

    async function deleteSubject(id) {
        if (!confirm('Delete this subject?')) return;
        await apiFetch(`/subjects/${id}`, 'DELETE');
        showAlert('Subject deleted.', 'danger');
        loadSubjects();
    }

    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    loadSubjects();
</script>
</body>
</html>
