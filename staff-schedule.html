<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Schedule - College Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>🏫 College Scheduler</h2>
            <span>Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <div class="nav-label">Manage</div>
            <a href="teachers.html"><span class="icon">👨‍🏫</span> Teachers</a>
            <a href="subjects.html"><span class="icon">📚</span> Subjects</a>
            <a href="classrooms.html"><span class="icon">🚪</span> Classrooms</a>
            <div class="nav-label">Scheduling</div>
            <a href="timetable.html"><span class="icon">📅</span> Timetable</a>
            <a href="staff-schedule.html" class="active"><span class="icon">🕐</span> Staff Schedule</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>🕐 Staff Schedule</h1>
            <div class="topbar-right">👤 Admin</div>
        </div>

        <div class="content">
            <div id="alert-box" class="alert hidden"></div>

            <!-- Assign Schedule -->
            <div class="card mb-2">
                <div class="card-title">Assign Staff Schedule</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Teacher *</label>
                        <select id="sc-teacher">
                            <option value="">-- Select Teacher --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Day *</label>
                        <select id="sc-day">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Shift *</label>
                        <select id="sc-shift">
                            <option value="Morning">Morning</option>
                            <option value="Afternoon">Afternoon</option>
                            <option value="Evening">Evening</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notes (optional)</label>
                        <input type="text" id="sc-notes" placeholder="e.g. Lab duty" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="sc-start" />
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="sc-end" />
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addSchedule()">+ Assign Schedule</button>
            </div>

            <!-- Schedule Table -->
            <div class="card">
                <div class="card-title">All Staff Schedules</div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Teacher</th>
                                <th>Day</th>
                                <th>Shift</th>
                                <th>Time</th>
                                <th>Notes</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-table">
                            <tr><td colspan="7"><div class="empty"><div class="empty-icon">🕐</div><p>No schedules assigned yet.</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    requireLogin();
    let teachers = [], schedules = [];

    async function init() {
        teachers = await apiFetch('/teachers');
        schedules = await apiFetch('/staff-schedule');

        const sel = document.getElementById('sc-teacher');
        sel.innerHTML = '<option value="">-- Select Teacher --</option>' +
            teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('schedule-table');
        if (schedules.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="empty-icon">🕐</div><p>No schedules assigned yet.</p></div></td></tr>`;
            return;
        }

        tbody.innerHTML = schedules.map((s, i) => {
            const teacher = teachers.find(t => t.id == s.teacher_id);
            const shiftClass = `shift-${s.shift?.toLowerCase()}`;
            const time = (s.start_time && s.end_time) ? `${s.start_time} - ${s.end_time}` : '-';
            return `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${teacher ? teacher.name : 'Unknown'}</strong></td>
                    <td>${s.day}</td>
                    <td><span class="badge ${shiftClass}">${s.shift}</span></td>
                    <td>${time}</td>
                    <td>${s.notes || '-'}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteSchedule(${s.id})">🗑️ Delete</button></td>
                </tr>
            `;
        }).join('');
    }

    async function addSchedule() {
        const teacher_id = document.getElementById('sc-teacher').value;
        const day = document.getElementById('sc-day').value;
        const shift = document.getElementById('sc-shift').value;
        if (!teacher_id) { showAlert('Please select a teacher.', 'danger'); return; }

        const data = {
            teacher_id,
            day,
            shift,
            start_time: document.getElementById('sc-start').value,
            end_time: document.getElementById('sc-end').value,
            notes: document.getElementById('sc-notes').value.trim()
        };

        await apiFetch('/staff-schedule', 'POST', data);
        showAlert('Schedule assigned!');
        schedules = await apiFetch('/staff-schedule');
        renderTable();
        document.getElementById('sc-notes').value = '';
        document.getElementById('sc-start').value = '';
        document.getElementById('sc-end').value = '';
    }

    async function deleteSchedule(id) {
        if (!confirm('Delete this schedule entry?')) return;
        await apiFetch(`/staff-schedule/${id}`, 'DELETE');
        showAlert('Deleted.', 'danger');
        schedules = await apiFetch('/staff-schedule');
        renderTable();
    }

    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    init();
</script>
</body>
</html>
