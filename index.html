<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <div class="emoji">🏫</div>
            <h1>College Scheduler</h1>
            <p>Staff Scheduling & Timetable Generator</p>
        </div>

        <div id="alert-box" class="alert hidden"></div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" />
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;" onclick="doLogin()">
            Login →
        </button>

        <p style="text-align:center;margin-top:16px;font-size:12px;color:#94a3b8;">
            Admin only access
        </p>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    // If already logged in, go to dashboard
    if (sessionStorage.getItem('loggedIn')) {
        window.location.href = 'dashboard.html';
    }

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showAlert('Please enter username and password.', 'danger');
            return;
        }

        try {
            const res = await apiFetch('/login', 'POST', { username, password });
            if (res.success) {
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('adminUser', username);
                window.location.href = 'dashboard.html';
            } else {
                showAlert(res.message || 'Invalid credentials.', 'danger');
            }
        } catch (e) {
            showAlert('Cannot connect to server. Make sure Flask is running.', 'danger');
        }
    }

    // Allow Enter key to login
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
